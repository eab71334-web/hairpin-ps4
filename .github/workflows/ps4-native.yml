name: Build PS4 PKG (Hairpin Rush)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', 'assets/**', '.github/workflows/ps4-native.yml']

permissions:
  contents: write

jobs:
  pkg:
    runs-on: ubuntu-22.04
    env:
      CLR_OPENSSL_VERSION_OVERRIDE: '1.1'
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update -y && sudo apt-get install -y clang lld jq

      - name: Install libssl1.1
        run: |
          cd /tmp
          for U in http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb; do
            curl -fsSL "$U" -o libssl1.1.deb && break
          done
          sudo dpkg -i libssl1.1.deb

      - name: Host test (game logic + software renderer, no console needed)
        run: |
          cd native/src
          g++ -O2 -std=c++17 -Wall -pthread -o /tmp/host_test game.cpp r3d.cpp world3d.cpp world_data.cpp host_main.cpp
          mkdir -p /tmp/shots && /tmp/host_test /tmp/shots

      - name: Download OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=""
          for i in 1 2 3 4 5; do
            URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest | jq -r '[(.assets // [])[] | select(.name|test("linux|toolchain";"i"))][0].browser_download_url // empty')
            [ -n "$URL" ] && break
            sleep 8
          done
          [ -n "$URL" ] || { echo "no toolchain"; exit 1; }
          mkdir -p /tmp/oo && curl -sL "$URL" -o /tmp/oo/tc.pkg
          cd /tmp/oo && (tar -xf tc.pkg 2>/dev/null || unzip -q tc.pkg)
          LX=$(find /tmp/oo -name link.x | head -1)
          echo "OO_PS4_TOOLCHAIN=$(dirname "$LX")" >> "$GITHUB_ENV"
          chmod -R +x "$(dirname "$LX")/bin" || true

      - name: Build PKG (from the working hello_world sample)
        run: |
          S="$OO_PS4_TOOLCHAIN/samples"; N=HairpinRush; BUILD=${{ github.run_number }}; VER=$(printf "01.%02d" $((BUILD % 100)))
          rm -rf "$S/$N"; cp -r "$S/hello_world" "$S/$N"
          rm -rf "$S/$N/hello_world"; mkdir -p "$S/$N/$N"
          cp native/src/*.h native/src/game.cpp native/src/r3d.cpp native/src/world3d.cpp native/src/world_data.cpp native/src/main_ps4.cpp "$S/$N/$N/"
          # icon (512x512) and background (1920x1080) wherever the sample keeps them
          for f in icon0.png pic0.png; do
            for d in $(find "$S/$N" -type d -name sce_sys); do cp "assets/sce_sys/$f" "$d/$f"; done
          done
          ( cd "$S/$N"
            sed -i "s|^LIBS .*|LIBS        := -lc -lkernel -lc++ -lSceUserService -lSceVideoOut -lSceAudioOut -lScePad -lSceSysmodule -lSDL2\nEXTRAFLAGS := -O2 -std=c++17 -march=btver2 -fno-math-errno -include HairpinRush/ps4_shim.h -DBUILD_ID=$BUILD|" Makefile
            sed -i "s/^VERSION .*/VERSION     := $VER/" Makefile
            # identity: homebrew title id / content id of OUR OWN (never a real game's id)
            sed -i "s/BREW00[0-9]*/BREW00791/g; s/IV0000-BREW00791_00-[A-Z0-9]*/IV0000-BREW00791_00-HAIRPINRUSH00000/; s/^TITLE .*/TITLE       := Hairpin Rush/" Makefile
            make || { echo '::warning::build with threads failed - retrying single-threaded'; rm -rf HairpinRush/x64; sed -i 's|-DBUILD_ID|-DHR_NO_THREADS -DBUILD_ID|' Makefile; make; }
            cp ./*.pkg "$GITHUB_WORKSPACE/HairpinRush.pkg"; cp ./*.pkg "$GITHUB_WORKSPACE/HairpinRush-b$BUILD.pkg" )
          ls -la "$GITHUB_WORKSPACE"/*.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: HairpinRush-pkg
          path: |
            HairpinRush.pkg
            HairpinRush-b*.pkg

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ps4-latest
          name: Hairpin Rush (PS4 PKG)
          files: |
            HairpinRush.pkg
            HairpinRush-b*.pkg
