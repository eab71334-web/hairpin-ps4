name: Build PS4 PKG (Hairpin Rush)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', 'assets/**', '.github/workflows/ps4-native.yml']

permissions:
  contents: write

jobs:
  pkg:
    runs-on: ubuntu-22.04
    env:
      CLR_OPENSSL_VERSION_OVERRIDE: '1.1'
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update -y && sudo apt-get install -y clang lld jq

      - name: Install libssl1.1
        run: |
          cd /tmp
          for U in http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb; do
            curl -fsSL "$U" -o libssl1.1.deb && break
          done
          sudo dpkg -i libssl1.1.deb

      - name: Host test (game logic + software renderer, no console needed)
        run: |
          cd native/src
          g++ -O2 -std=c++17 -Wall -pthread -o /tmp/host_test game.cpp r3d.cpp world3d.cpp world_data.cpp host_main.cpp
          mkdir -p /tmp/shots && /tmp/host_test /tmp/shots

      - name: Download OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=""
          for i in 1 2 3 4 5; do
            URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest | jq -r '[(.assets // [])[] | select(.name|test("linux|toolchain";"i"))][0].browser_download_url // empty')
            [ -n "$URL" ] && break
            sleep 8
          done
          [ -n "$URL" ] || { echo "no toolchain"; exit 1; }
          mkdir -p /tmp/oo && curl -sL "$URL" -o /tmp/oo/tc.pkg
          cd /tmp/oo && (tar -xf tc.pkg 2>/dev/null || unzip -q tc.pkg)
          LX=$(find /tmp/oo -name link.x | head -1)
          echo "OO_PS4_TOOLCHAIN=$(dirname "$LX")" >> "$GITHUB_ENV"
          chmod -R +x "$(dirname "$LX")/bin" || true

      - name: Build PKG (OpenOrbis piglet sample base: GPU presents the frame)
        run: |
          S="$OO_PS4_TOOLCHAIN/samples"; N=HairpinRush; BUILD=${{ github.run_number }}; VER=$(printf "01.%02d" $((BUILD % 100)))
          if [ ! -d "$S/piglet" ]; then
            git clone -q --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain /tmp/oo-src
            cp -r /tmp/oo-src/samples/piglet "$S/piglet"
          fi
          rm -rf "$S/$N"; cp -r "$S/piglet" "$S/$N"
          rm -rf "$S/$N/piglet"; mkdir -p "$S/$N/$N"
          cp native/src/*.h native/src/game.cpp native/src/r3d.cpp native/src/world3d.cpp native/src/world_data.cpp "$S/$N/$N/"
          cp native/src/main_ps4.cpp "$S/$N/$N/main.cpp"
          ( cd "$S/$N"
            sed -i "s/^LIBS .*/LIBS        := -lc -lkernel -lc++ -lSceShellCoreUtil -lSceSysmodule -lSceSystemService -lScePigletv2VSH -lScePrecompiledShaders -lSceRtc -lSceUserService -lScePad -lSceAudioOut/" Makefile
            sed -i "s/^EXTRAFLAGS .*/EXTRAFLAGS  := -fexceptions -fcxx-exceptions -O2 -std=c++17 -march=btver2 -fno-math-errno -include HairpinRush\/ps4_shim.h -DHR_NO_THREADS -DBUILD_ID=$BUILD/" Makefile
            sed -i "s/^VERSION .*/VERSION     := $VER/; s/^TITLE .*/TITLE       := Hairpin Rush/; s/^TITLE_ID .*/TITLE_ID    := BREW00791/; s/^CONTENT_ID .*/CONTENT_ID  := IV0000-BREW00791_00-HAIRPINRUSH00000/" Makefile
            cp "$GITHUB_WORKSPACE/assets/sce_sys/icon0.png" sce_sys/icon0.png || true
            cp "$GITHUB_WORKSPACE/assets/sce_sys/pic0.png" sce_sys/pic0.png || true
            grep -nE "^(LIBS|EXTRAFLAGS|TITLE|TITLE_ID|CONTENT_ID|VERSION)" Makefile
            make
            cp ./*.pkg "$GITHUB_WORKSPACE/HairpinRush.pkg"; cp ./*.pkg "$GITHUB_WORKSPACE/HairpinRush-b$BUILD.pkg" )
          ls -la "$GITHUB_WORKSPACE"/*.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: HairpinRush-pkg
          path: |
            HairpinRush.pkg
            HairpinRush-b*.pkg

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ps4-latest
          name: Hairpin Rush (PS4 PKG)
          files: |
            HairpinRush.pkg
            HairpinRush-b*.pkg
